name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

jobs:
  deploy:
    name: Trigger Cloud Deployment
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Trigger Render Deployment
        env:
          HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$HOOK_URL" ]; then
            echo "Triggering automated deployment on Render..."
            curl -sSf "$HOOK_URL" || echo "Warning: Render deploy hook returned non-200 response"
          else
            echo "RENDER_DEPLOY_HOOK_URL secret is not set yet. Skipping deploy hook."
            echo "To enable auto-deploy, add RENDER_DEPLOY_HOOK_URL to GitHub Repository Secrets."
          fi
